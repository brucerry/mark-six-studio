name: Signed installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the application version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate release tag and credentials
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Release requires a version tag.' }
          $version = [regex]::Match((Get-Content src/desktop/CMakeLists.txt -Raw), 'project\(MarkSixStatisticsDesktop VERSION ([0-9.]+)').Groups[1].Value
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag does not match application version.' }
          if (-not $env:WINDOWS_PFX_BASE64 -or -not $env:WINDOWS_PFX_PASSWORD) { throw 'Windows signing credentials are missing.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'marksix-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force)
            "WINDOWS_SIGN_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } finally { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
      - name: Build and test
        shell: pwsh
        run: |
          ./scripts/fetch-sqlite.ps1 -Fetch
          ./scripts/fetch-msvc.ps1
          ./scripts/fetch-statistics-qt.ps1 -Fetch
          ./scripts/build-statistics-desktop.ps1 -Tests
          ./scripts/package-statistics-desktop.ps1 -Signed
          ./scripts/test-statistics-package-verifier.ps1 -PackageDirectory ./release/mark-six-studio
          ./scripts/build-windows-installer.ps1 -PackageDirectory ./release/mark-six-studio -Signed
          $installer = Get-ChildItem ./release/windows-installer/*-setup.exe
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: release/windows-installer/*
          if-no-files-found: error
      - name: Remove signing identity
        if: always()
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGN_CERT_THUMBPRINT) { Remove-Item "Cert:\CurrentUser\My\$env:WINDOWS_SIGN_CERT_THUMBPRINT" -Force }

  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Validate release tag and import signing identities
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          MACOS_CERTIFICATES_BASE64: ${{ secrets.MACOS_CERTIFICATES_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: python3 scripts/setup-macos-signing.py
      - name: Build, sign, notarize and verify installer
        env:
          MACOS_APP_IDENTITY: ${{ secrets.MACOS_APP_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_PROFILE: marksix-release
        run: |
          bash scripts/build-macos.sh
          python3 scripts/package-macos.py --signed
          python3 scripts/test-macos-package-verifier.py 'release/macos/Mark Six Studio.app'
          python3 scripts/test-macos-installer.py release/macos/*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: signed-macos
          path: |
            release/macos/*.pkg
            release/macos/*.json
            release/macos/*.sha256
          if-no-files-found: error
      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/marksix-release.keychain-db" || true

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: release-assets
          merge-multiple: true
      - name: Publish verified signed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if find release-assets -name '*unsigned*' | grep -q .; then exit 1; fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Mark Six Studio $RELEASE_TAG" --generate-notes
